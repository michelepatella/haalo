# Building --------------------------------------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

# Project settings ------------------------------------------------------------------------------------------------
[project]
name = "haalo"
version = "0.2.0"
description = "Multi-turn RAG chatbot for conversational analysis of academic documents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14,<3.15"

# Required dependencies -------------------------------------------------------------------------------------------
dependencies = [
    "chromadb==1.5.9",
    "llama-index==0.14.23",
    "llama-index-vector-stores-chroma==0.5.5",
    "llama-index-embeddings-huggingface==0.7.0",
    "llama-index-llms-ollama==0.10.1",
    "pymupdf==1.28.0",
    "pymupdf4llm==1.28.0",
    "streamlit==1.60.0",
    "pubguard @ git+https://github.com/jimnoneill/pubguard.git"
]

# Optional dependencies -------------------------------------------------------------------------------------------
[project.optional-dependencies]
dev = ["ruff==0.16.1", "pre-commit==4.6.0"]

# Other project settings ------------------------------------------------------------------------------------------
[project.urls]
"Source" = "https://github.com/michelepatella/haalo"

# Tools settings --------------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["ALL"]
extend-select = ["D"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"
